name: strspc lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rules:
    uses: SteerSpec/.github/.github/workflows/strspc-lint.yml@v1
    permissions:
      contents: read
      pull-requests: read
    with:
      path: rules/
      strict: true
